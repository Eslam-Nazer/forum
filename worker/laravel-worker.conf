[program:forum-laravel-worker]
process_name=%(program_name)s_%(process_num)02d
#command=/var/www/html/vendor/bin/sail /var/www/html/artisan queue:work --sleep=3 --tries=3 --timeout=30
command=/bin/bash -c "cd /var/www/code/Forum && ./vendor/bin/sail artisan queue:work --sleep=3 --tries=3 --timeout=120"
autostart=true
autorestart=true
numprocs=1
redirect_stdrr=true
stdout_logfile=/var/www/code/Forum/storage/logs/worker.log
stopwaitsecs=3600 
